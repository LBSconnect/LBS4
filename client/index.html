    <!-- Event and FAQPage JSON-LD used to live here as sitewide blocks, but
         schema.org markup is supposed to describe the content of the page
         it's on (Google's structured-data policy) — a boot-camp Event or a
         Pearson-VUE FAQ has nothing to do with, say, /privacy-policy or the
         I-9 employer portal, and serving it there risks losing FAQ rich-result
         eligibility once detected. Each block now lives only on the page
         whose visible content it actually matches: the boot-camp Event
         schema is emitted by ServiceDetail.tsx for the two boot-camp routes,
         the Testing Center / notary / passport FAQs by ServiceDetail.tsx for
         those pages, and the general "before you arrive" FAQ by Home.tsx —
